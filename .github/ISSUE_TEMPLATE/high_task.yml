name: High Task
description: A complex task requiring significant expertise or effort
title: "[High] "
labels: ["difficulty: high", "help wanted"]
assignees: ''
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! This is a High task worth **5 points** in our contribution wave.
        
        Please review the [contributing guidelines](CONTRIBUTING.md) before starting.
  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Clear description of what needs to be done
      placeholder: Describe the high complexity task here...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Implementation Steps
      description: Suggested steps to complete the task
      placeholder: |
        1. First step
        2. Second step
        3. etc.
    validations:
      required: false
  - type: textarea
    id: considerations
    attributes:
      label: Implementation Considerations
      description: Any special considerations, challenges, or integration points
      placeholder: |
        - Potential edge cases to consider
        - Performance implications
        - Dependencies on other components
        - Testing strategies
    validations:
      required: false
  - type: textarea
    id: resources
    attributes:
      label: Helpful Resources
      description: Links to documentation, code references, or other helpful materials
      placeholder: |
        - Link to relevant documentation
        - Similar implementations in the codebase
        - External resources
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Contributor Agreement
      options:
        - label: I have read the contributing guidelines
          required: true
