name: Medium Task
description: A moderately complex task requiring some familiarity with the codebase
title: "[Medium] "
labels: ["difficulty: medium", "help wanted"]
assignees: ''
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! This is a Medium task worth **3 points** in our contribution wave.
        
        Please review the [contributing guidelines](CONTRIBUTING.md) before starting.
  - type: textarea
    id: description
    attributes:
      label: Task Description
      description: Clear description of what needs to be done
      placeholder: Describe the medium task here...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Implementation Steps
      description: Suggested steps to complete the task
      placeholder: |
        1. First step
        2. Second step
        3. etc.
    validations:
      required: false
  - type: textarea
    id: considerations
    attributes:
      label: Implementation Considerations
      description: Any special considerations or potential challenges
      placeholder: Note any edge cases, performance considerations, or integration points...
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Contributor Agreement
      options:
        - label: I have read the contributing guidelines
          required: true
